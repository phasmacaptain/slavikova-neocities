<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Webdeck Player · Silver</title>
    <link rel="icon" type="image/svg+xml" href="../assets/pixel-heart.svg">
    <link rel="stylesheet" href="silver.css">
    <link rel="stylesheet" href="../color-overrides.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main id="web-deck-player">
        <div id="player-title-bar">WEBDECK PLAYER</div>
        <section id="player-body">
            <div id="player-main">
                <div id="player-display">
                    <div id="youtube-player"></div>
                </div>
                <div id="player-info">
                    <div id="info-screen">
                        <div id="songLabel">LOADING...</div>
                        <div id="statusLabel">waiting for YouTube</div>
                    </div>
                    <div class="player-row">
                        <button id="volumeButton" type="button" title="Mute or unmute">VOL</button>
                        <input id="volumeBar" type="range" min="0" max="100" value="50" title="Volume">
                    </div>
                    <div class="player-row">
                        <button id="videoButton" type="button" class="toggle-button" data-on="true">VIDEO ●</button>
                        <div id="playerLogo">WEBDECK<br><small>SILVER</small></div>
                    </div>
                </div>
            </div>
            <input id="seekBar" type="range" value="0" min="0" max="100" title="Seek">
            <div id="player-control-panel">
                <div class="playing-controls">
                    <button id="prevButton" type="button" title="Previous">◀</button>
                    <button id="playButton" type="button" title="Play or pause">▶</button>
                    <button id="stopButton" type="button" title="Stop">■</button>
                    <button id="nextButton" type="button" title="Next">▶▶</button>
                </div>
                <div class="playing-controls">
                    <button id="shuffleButton" type="button" class="toggle-button" data-on="false">SHUF ○</button>
                </div>
                <select id="playlistSelector" title="Playlist"></select>
                <button id="infoButton" type="button" title="Info">i</button>
            </div>
        </section>
    </main>
</body>

</html>
